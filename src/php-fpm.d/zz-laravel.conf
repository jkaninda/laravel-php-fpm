[www]
; Expose container environment variables (DB_HOST, APP_KEY, ...) to PHP workers
clear_env = no

; Process manager, tunable through PHP_FPM_* environment variables
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}

; Health endpoint for FastCGI probes
ping.path = /ping
ping.response = pong
