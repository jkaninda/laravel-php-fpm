name: Tests
on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        variant: ["debian", "alpine"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant == 'alpine' && './src/docker/Dockerfile.alpine' || './src/docker/Dockerfile' }}
          load: true
          build-args: |
            phpVersion=${{ matrix.php }}
          tags: laravel-php-fpm:test
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.variant }}
      - name: Run integration tests
        env:
          IMAGE: laravel-php-fpm:test
        run: ./tests/integration.sh
